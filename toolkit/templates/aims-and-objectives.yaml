# sources: Decide On Aims and Objectives ("Aim and Objectives Artifact"), Minimal Theory of Change,
#          Identify Core Features, Interoperability Intent, Adaptability and Extensibility,
#          Inclusivity, Real-World Testnet, Development Principles
# Aim at change, not delivery. Prefer "contribute to / enable / reduce barriers to" over "ensure / guarantee".

aim:
objectives:
  - objective:
    intended_change:
    affected_actors: []
    evidence:
    mechanism:
    required_capabilities: []
    success_signal:
    assumptions: []
theory_of_change:          # CURRENT PATTERN → INTERVENTION → MECHANISM → NEAR-TERM OUTCOME → PATTERN CHANGE → IMPACT
  current_pattern:
  intervention:
  mechanisms: []
  outcomes: []
  intended_impact:
  enabling_conditions: []
  assumptions: []          # weak or untested links → learning questions
  unintended_effects: []
  learning_questions: []
  strongest_critic_would_say:
core_features:             # traceability: aim → objective → required capability → feature
  - feature:
    enables_objective:
    priority:              # essential | desirable | optional | deferred
in_scope: []
out_of_scope: []           # "Scope Is Also Exclusion"
interoperability_intent:   # always: interoperable with what, for what purpose?
  - with:
    purpose:
adaptability_intent:
  stable_core: []
  open_edge: []
  harmful_variation: []
inclusivity_intent:         # Inclusivity — who could use, shape, or be served by this but practically cannot?
  excluded_from_development: []
  excluded_from_use: []
  excluded_from_governance: []
  affected_without_access: []
  translation_needs: []    # spoken language, technical↔nontechnical, human↔machine, expert↔newcomer, ...
  accessibility_requirements: []
  legitimate_variation: []
  participation_costs: []
  success_exclusion_risks: []
test_intent:
  claims_to_test: []
  environments: []
  testers: []
  failure_looks_like: []
development_principles: []
open_questions: []
gate_outcome:              # proceed | refine | return-to-opportunity | return-to-ecosystem | reconsider-intervention
