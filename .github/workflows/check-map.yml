name: Check framework map

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Map is current; frontmatter, canvas links and toolkit ids are valid
        run: python tools/build_index.py --check
